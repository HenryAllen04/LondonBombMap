<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Dirt module preview</title>
<style> body { margin: 0; overflow: hidden; background: #0f1115; } </style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { buildDirtIsland } from './dirt.js';

const config = await (await fetch('./dirt-config.json')).json();

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1115);
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 60);
camera.position.set(4.2, 0.9, 4.8).normalize().multiplyScalar(6.4 * Math.max(1, 1.3 / (window.innerWidth / window.innerHeight)));
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -0.5, 0);

scene.add(new THREE.HemisphereLight(0xcfd8e6, 0x3a2e22, 0.9));
const key = new THREE.DirectionalLight(0xfff2dd, 1.6);
key.position.set(4, 6, 3);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8899bb, 0.4);
fill.position.set(-4, -2, -3);
scene.add(fill);

scene.add(buildDirtIsland(config));

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
